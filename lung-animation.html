<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lung Breathing Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 50% 40%, #1e0f3c 0%, #0b0618 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #ddd;
    overflow: hidden;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c4a8f0;
    margin-bottom: 6px;
  }

  .sub {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: #6a5080;
    margin-bottom: 36px;
  }

  /* ── Glow ring ── */
  .scene {
    position: relative;
    width: 380px;
    height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow-ring {
    position: absolute;
    width: 300px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(190,100,160,0.22) 0%, transparent 70%);
    animation: glowPulse 5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%,100% { transform: scale(0.9); opacity: 0.6; }
    50%      { transform: scale(1.12); opacity: 1; }
  }

  /* ── SVG layers ── */
  svg { position: relative; z-index: 1; overflow: visible; }

  /* trachea stays still */
  #trachea { /* no animation */ }

  /* lungs breathe */
  #lung-left {
    transform-origin: 168px 205px;
    animation: breatheLeft 5s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
  }
  #lung-right {
    transform-origin: 218px 205px;
    animation: breatheRight 5s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
  }

  @keyframes breatheLeft {
    0%,100% { transform: scale(1);        }
    50%      { transform: scale(1.14, 1.18) translate(-4px, 0); }
  }
  @keyframes breatheRight {
    0%,100% { transform: scale(1);        }
    50%      { transform: scale(1.14, 1.18) translate(4px, 0); }
  }

  /* colour shift: pale rose → deep red-pink */
  .lung-fill {
    animation: lungColor 5s ease-in-out infinite;
  }
  @keyframes lungColor {
    0%,100% { fill: #e8909e; }
    50%      { fill: #c0364f; }
  }

  /* highlight shimmer */
  .lung-hl {
    animation: hlFade 5s ease-in-out infinite;
  }
  @keyframes hlFade {
    0%,100% { opacity: 0.55; }
    50%      { opacity: 0.25; }
  }

  /* air flow particles */
  .particle {
    animation: floatUp 5s ease-in-out infinite;
    opacity: 0;
  }
  .particle:nth-child(1) { animation-delay: 0s; }
  .particle:nth-child(2) { animation-delay: 0.6s; }
  .particle:nth-child(3) { animation-delay: 1.2s; }
  .particle:nth-child(4) { animation-delay: 1.8s; }
  .particle:nth-child(5) { animation-delay: 2.4s; }

  @keyframes floatUp {
    0%      { opacity: 0;   transform: translateY(0) scale(0.5); }
    20%     { opacity: 0.7; }
    60%     { opacity: 0.3; }
    100%    { opacity: 0;   transform: translateY(-60px) scale(1.2); }
  }

  /* ── Breath label ── */
  .label-wrap {
    margin-top: 20px;
    height: 28px;
    position: relative;
    width: 140px;
    text-align: center;
  }

  .label {
    position: absolute;
    left: 0; right: 0;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  #lbl-inhale {
    color: #c084fc;
    animation: showInhale 5s ease-in-out infinite;
  }
  #lbl-exhale {
    color: #80b4fc;
    animation: showExhale 5s ease-in-out infinite;
  }

  @keyframes showInhale {
    0%       { opacity: 0; }
    5%       { opacity: 1; }
    45%      { opacity: 1; }
    50%      { opacity: 0; }
    100%     { opacity: 0; }
  }
  @keyframes showExhale {
    0%,50%   { opacity: 0; }
    55%      { opacity: 1; }
    95%      { opacity: 1; }
    100%     { opacity: 0; }
  }

  /* ── Controls ── */
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 14px;
  }

  button {
    background: rgba(192,132,252,0.1);
    border: 1px solid rgba(192,132,252,0.35);
    color: #c084fc;
    padding: 7px 22px;
    border-radius: 20px;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover {
    background: rgba(192,132,252,0.25);
    border-color: rgba(192,132,252,0.65);
  }

  .speed-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    color: #6a5080;
    letter-spacing: 0.1em;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 110px;
    height: 3px;
    background: rgba(192,132,252,0.3);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #c084fc;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Lung Animation</h1>
<p class="sub">Inhale &nbsp;·&nbsp; Exhale</p>

<div class="scene">
  <div class="glow-ring"></div>

  <svg id="svg" width="380" height="400" viewBox="0 0 380 400">
    <defs>
      <!-- Left lung gradient -->
      <radialGradient id="lgLeft" cx="38%" cy="35%" r="58%">
        <stop offset="0%" stop-color="#f5b8c4"/>
        <stop offset="100%" stop-color="#c0364f"/>
      </radialGradient>
      <!-- Right lung gradient -->
      <radialGradient id="lgRight" cx="62%" cy="35%" r="58%">
        <stop offset="0%" stop-color="#f5b8c4"/>
        <stop offset="100%" stop-color="#c0364f"/>
      </radialGradient>
      <!-- Soft drop shadow -->
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c0364f" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- ─── Left Lung ─── -->
    <g id="lung-left" filter="url(#shadow)">
      <path class="lung-fill"
        d="
          M 168 100
          C 165 88, 155 80, 142 82
          C 118 86, 96 108, 84 136
          C 68 172, 66 210, 72 248
          C 78 288, 96 320, 118 340
          C 132 352, 148 358, 162 354
          C 172 350, 178 340, 178 328
          C 178 310, 170 290, 168 270
          C 164 242, 166 215, 168 188
          C 170 162, 172 132, 168 100
          Z
        "
        fill="url(#lgLeft)"
        stroke="#a0253a"
        stroke-width="1.5"
      />
      <!-- Left lung lobe crease -->
      <path d="M 84 210 Q 120 200 168 210" fill="none" stroke="#a0253a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
      <path d="M 74 268 Q 118 255 168 268" fill="none" stroke="#a0253a" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
      <!-- Highlight -->
      <ellipse class="lung-hl" cx="118" cy="160" rx="18" ry="38" fill="white" opacity="0.5"
        transform="rotate(-20,118,160)"/>
    </g>

    <!-- ─── Right Lung ─── -->
    <g id="lung-right" filter="url(#shadow)">
      <path class="lung-fill"
        d="
          M 218 100
          C 220 88, 228 80, 242 82
          C 268 86, 292 110, 304 140
          C 318 178, 320 218, 314 256
          C 308 292, 290 322, 268 342
          C 254 354, 238 358, 224 354
          C 212 350, 206 338, 206 324
          C 208 306, 216 286, 218 265
          C 222 238, 220 210, 218 182
          C 216 158, 214 130, 218 100
          Z
        "
        fill="url(#lgRight)"
        stroke="#a0253a"
        stroke-width="1.5"
      />
      <!-- Right lung lobe creases (3 lobes) -->
      <path d="M 304 195 Q 264 185 218 195" fill="none" stroke="#a0253a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
      <path d="M 312 258 Q 268 245 218 258" fill="none" stroke="#a0253a" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
      <!-- Highlight -->
      <ellipse class="lung-hl" cx="262" cy="158" rx="18" ry="38" fill="white" opacity="0.5"
        transform="rotate(20,262,158)"/>
    </g>

    <!-- ─── Trachea & Bronchi (drawn on top) ─── -->
    <g id="trachea">
      <!-- Trachea -->
      <rect x="184" y="48" width="18" height="70" rx="9"
        fill="#b8d8f0" stroke="#6aa8d0" stroke-width="1.5"/>
      <!-- Trachea rings (decorative) -->
      <line x1="185" y1="62"  x2="201" y2="62"  stroke="#6aa8d0" stroke-width="1.2" opacity="0.6"/>
      <line x1="185" y1="72"  x2="201" y2="72"  stroke="#6aa8d0" stroke-width="1.2" opacity="0.6"/>
      <line x1="185" y1="82"  x2="201" y2="82"  stroke="#6aa8d0" stroke-width="1.2" opacity="0.6"/>
      <line x1="185" y1="92"  x2="201" y2="92"  stroke="#6aa8d0" stroke-width="1.2" opacity="0.6"/>
      <line x1="185" y1="102" x2="201" y2="102" stroke="#6aa8d0" stroke-width="1.2" opacity="0.6"/>

      <!-- Left main bronchus -->
      <path d="M 184 112 Q 160 120 150 140"
        fill="none" stroke="#6aa8d0" stroke-width="10" stroke-linecap="round"/>
      <path d="M 184 112 Q 160 120 150 140"
        fill="none" stroke="#b8d8f0" stroke-width="6" stroke-linecap="round"/>

      <!-- Right main bronchus -->
      <path d="M 202 112 Q 228 118 238 136"
        fill="none" stroke="#6aa8d0" stroke-width="10" stroke-linecap="round"/>
      <path d="M 202 112 Q 228 118 238 136"
        fill="none" stroke="#b8d8f0" stroke-width="6" stroke-linecap="round"/>

      <!-- Left secondary bronchi -->
      <path d="M 150 140 Q 138 158 135 175" fill="none" stroke="#6aa8d0" stroke-width="6" stroke-linecap="round"/>
      <path d="M 150 140 Q 158 160 155 180" fill="none" stroke="#6aa8d0" stroke-width="5" stroke-linecap="round"/>

      <!-- Right secondary bronchi -->
      <path d="M 238 136 Q 252 155 255 174" fill="none" stroke="#6aa8d0" stroke-width="6" stroke-linecap="round"/>
      <path d="M 238 136 Q 244 158 242 178" fill="none" stroke="#6aa8d0" stroke-width="5" stroke-linecap="round"/>
      <path d="M 238 136 Q 262 150 268 170" fill="none" stroke="#6aa8d0" stroke-width="4" stroke-linecap="round"/>

      <!-- Air flow particles in trachea -->
      <circle class="particle" cx="193" cy="100" r="3" fill="#b8d8f0"/>
      <circle class="particle" cx="189" cy="86"  r="2" fill="#b8d8f0"/>
      <circle class="particle" cx="196" cy="76"  r="2.5" fill="#b8d8f0"/>
      <circle class="particle" cx="191" cy="64"  r="2" fill="#c8e8ff"/>
      <circle class="particle" cx="195" cy="54"  r="1.5" fill="#c8e8ff"/>
    </g>
  </svg>
</div>

<!-- Breath label -->
<div class="label-wrap">
  <span class="label" id="lbl-inhale">Inhale</span>
  <span class="label" id="lbl-exhale">Exhale</span>
</div>

<!-- Controls -->
<div class="controls">
  <button id="btnToggle">Pause</button>
  <button id="btnRestart">Restart</button>
</div>

<div class="speed-row">
  <span>Slow</span>
  <input type="range" id="speedSlider" min="0.3" max="3" step="0.1" value="1">
  <span>Fast</span>
</div>

<script>
  let paused = false;
  const allAnimated = document.querySelectorAll(
    '#lung-left, #lung-right, .lung-fill, .lung-hl, .glow-ring, .particle, #lbl-inhale, #lbl-exhale'
  );

  document.getElementById('btnToggle').addEventListener('click', () => {
    paused = !paused;
    allAnimated.forEach(el => {
      el.style.animationPlayState = paused ? 'paused' : 'running';
    });
    document.getElementById('btnToggle').textContent = paused ? 'Play' : 'Pause';
  });

  document.getElementById('btnRestart').addEventListener('click', () => {
    allAnimated.forEach(el => {
      el.style.animation = 'none';
      el.offsetHeight; // reflow
      el.style.animation = '';
      el.style.animationPlayState = 'running';
    });
    paused = false;
    document.getElementById('btnToggle').textContent = 'Pause';
  });

  document.getElementById('speedSlider').addEventListener('input', (e) => {
    const dur = (5 / parseFloat(e.target.value)).toFixed(2) + 's';
    allAnimated.forEach(el => {
      el.style.animationDuration = dur;
    });
  });
</script>

</body>
</html>
