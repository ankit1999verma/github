<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lung Breathing Animation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: radial-gradient(ellipse at 50% 38%, #1c0f30 0%, #090512 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #d4b0f0;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    color: #58406a;
    margin-bottom: 22px;
  }

  /* ── Scene ── */
  .scene {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glow {
    position: absolute;
    width: 80%; height: 80%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(210,80,120,0.18) 0%, transparent 68%);
    animation: glow 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glow {
    0%,100% { transform: scale(0.90); opacity:0.65; }
    50%      { transform: scale(1.12); opacity:1; }
  }

  svg { position:relative; z-index:1; overflow:visible; }

  /* ── Right lung (viewer's left) ── */
  #rl {
    transform-origin: 268px 150px;
    animation: breatheR 5s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
  }
  @keyframes breatheR {
    0%,100% { transform: scale(1,1) translate(0,0); }
    50%      { transform: scale(1.13,1.11) translate(-7px, 5px); }
  }

  /* ── Left lung (viewer's right) ── */
  #ll {
    transform-origin: 332px 150px;
    animation: breatheL 5s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
  }
  @keyframes breatheL {
    0%,100% { transform: scale(1,1) translate(0,0); }
    50%      { transform: scale(1.13,1.11) translate(7px, 5px); }
  }

  /* colour shift on inhale */
  .lf { animation: lc 5s ease-in-out infinite; }
  @keyframes lc {
    0%,100% { fill: url(#gNorm); }
    50%      { fill: url(#gFull); }
  }
  .lfL { animation: lcL 5s ease-in-out infinite; }
  @keyframes lcL {
    0%,100% { fill: url(#gNormL); }
    50%      { fill: url(#gFullL); }
  }

  /* bronchi pulse */
  .br { animation: bc 5s ease-in-out infinite; }
  @keyframes bc {
    0%,100% { stroke: #cc4060; opacity:0.82; }
    50%      { stroke: #aa2845; opacity:1; }
  }

  /* ── Breath labels ── */
  .lw {
    position: relative;
    margin-top: 14px;
    width: 140px; height: 24px;
    text-align: center;
  }
  .lbl {
    position:absolute; left:0; right:0;
    font-size: 0.82rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  #li { color:#c084fc; animation: si 5s ease-in-out infinite; }
  #le { color:#80b4fc; animation: se 5s ease-in-out infinite; }
  @keyframes si {
    0%    { opacity:0; } 8%  { opacity:1; }
    44%   { opacity:1; } 50% { opacity:0; } 100% { opacity:0; }
  }
  @keyframes se {
    0%,50% { opacity:0; } 58% { opacity:1; }
    94%    { opacity:1; } 100%{ opacity:0; }
  }

  /* ── Controls ── */
  .ctrls { margin-top:18px; display:flex; gap:12px; }
  button {
    background: rgba(192,132,252,0.09);
    border: 1px solid rgba(192,132,252,0.32);
    color: #c084fc;
    padding: 6px 20px;
    border-radius: 18px;
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.18s;
  }
  button:hover { background: rgba(192,132,252,0.22); }

  .srow {
    margin-top:12px;
    display:flex; align-items:center; gap:10px;
    font-size:0.68rem; color:#58406a; letter-spacing:0.1em;
  }
  input[type=range] {
    -webkit-appearance:none;
    width:100px; height:3px;
    background: rgba(192,132,252,0.22);
    border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:12px; height:12px;
    border-radius:50%; background:#c084fc; cursor:pointer;
  }
</style>
</head>
<body>

<h1>Lung Animation</h1>
<p class="sub">Inhale &nbsp;·&nbsp; Exhale</p>

<div class="scene">
  <div class="glow"></div>

  <svg width="600" height="540" viewBox="0 0 600 540">
    <defs>

      <!-- Right lung gradients -->
      <radialGradient id="gNorm" cx="38%" cy="32%" r="65%" gradientUnits="objectBoundingBox">

        <stop offset="38%"  stop-color="#e8909e"/>
        <stop offset="100%" stop-color="#be4e65"/>
      </radialGradient>
      <radialGradient id="gFull" cx="38%" cy="32%" r="65%" gradientUnits="objectBoundingBox">
        <stop offset="0%"   stop-color="#f8b0be"/>
        <stop offset="38%"  stop-color="#d87088"/>
        <stop offset="100%" stop-color="#a83855"/>
      </radialGradient>

      <!-- Left lung gradients -->
      <radialGradient id="gNormL" cx="62%" cy="32%" r="65%" gradientUnits="objectBoundingBox">
        <stop offset="0%"   stop-color="#fac8d0"/>
        <stop offset="38%"  stop-color="#e8909e"/>
        <stop offset="100%" stop-color="#be4e65"/>
      </radialGradient>
      <radialGradient id="gFullL" cx="62%" cy="32%" r="65%" gradientUnits="objectBoundingBox">
        <stop offset="0%"   stop-color="#f8b0be"/>
        <stop offset="38%"  stop-color="#d87088"/>
        <stop offset="100%" stop-color="#a83855"/>
      </radialGradient>

      <!-- Highlight gradient (left-to-right shine) -->
      <linearGradient id="hlR" x1="0%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%"   stop-color="white" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="hlL" x1="100%" y1="0%" x2="20%" y2="100%">
        <stop offset="0%"   stop-color="white" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>

      <!-- Bump texture -->
      <filter id="bump" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"
          xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
      </filter>

      <!-- Glow shadow -->
      <filter id="gsh" x="-18%" y="-18%" width="136%" height="136%">
        <feDropShadow dx="0" dy="5" stdDeviation="14"
          flood-color="#c04060" flood-opacity="0.45"/>
      </filter>

    </defs>

    <!-- ══════════════════ RIGHT LUNG (viewer's left) ══════════════════ -->

        <!-- upper-lower -->

          <path class="br" d="M 122 138 Q 112 148 105 158"
            fill="none" stroke-width="2" stroke-linecap="round"/>

          <path class="br" d="M 122 138 Q 116 152 112 165"

      <!-- MIDDLE LOBE bronchus -->

        <!-- branch at 365 -->

            <path class="br" d="M  96 362 Q  78 360  64 362"

          <path class="br" d="M 142 364 Q 130 382 122 396"
            fill="none" stroke-width="1.5" stroke-linecap="round"/>
        <!-- lower base -->
        <path class="br" d="M 192 418 Q 162 418 136 422"
          fill="none" stroke-width="2.5" stroke-linecap="round"/>
          <path class="br" d="M 136 422 Q 112 424  92 428"
            fill="none" stroke-width="1.5" stroke-linecap="round"/>
            <path class="br" d="M  92 428 Q  76 430  62 434"
              fill="none" stroke-width="1.0" stroke-linecap="round"/>
          <path class="br" d="M 136 422 Q 126 440 120 454"
            fill="none" stroke-width="1.2" stroke-linecap="round"/>
        <path class="br" d="M 192 418 Q 188 440 185 458"
          fill="none" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- ══════════════════ LEFT LUNG (viewer's right) ══════════════════ -->
    <g id="ll" filter="url(#gsh)">

      <path class="lfL" filter="url(#bump)"
        d="M 332 148
           C 345 125, 368 95,  400 82
           C 428 70,  462 72,  492 88
           C 524 105, 546 132, 556 168
           C 570 210, 572 258, 564 304
           C 556 350, 534 392, 502 425
           C 476 450, 442 470, 406 480
           C 378 488, 348 488, 336 472

      />
      <path
        d="M 332 148

           C 556 350, 534 392, 502 425
           C 476 450, 442 470, 406 480
           C 378 488, 348 488, 336 472
           C 328 460, 328 442, 332 420
           C 338 394, 346 365, 348 335
           C 352 302, 350 268, 346 238
           C 342 210, 336 180, 332 148 Z"
        fill="url(#hlL)" opacity="0.7"
      />

      <!-- Oblique fissure (left lung has 2 lobes) -->
      <path d="M 550 210 Q 452 197 336 210"
        fill="none" stroke="#b84060" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.45"/>

      <!-- ── Bronchial Tree – Left Lung ── -->
      <path class="br" d="M 348 165 Q 360 188 362 215"
        fill="none" stroke-width="8" stroke-linecap="round"/>

      <!-- UPPER LOBE bronchus -->
      <path class="br" d="M 352 172 Q 385 152 415 132 Q 440 115 464 105"
        fill="none" stroke-width="6" stroke-linecap="round"/>
        <path class="br" d="M 464 105 Q 485  95 504  90"
          fill="none" stroke-width="3.8" stroke-linecap="round"/>
          <path class="br" d="M 504  90 Q 520  86 534  83"
            fill="none" stroke-width="2.2" stroke-linecap="round"/>
          <path class="br" d="M 534  83 Q 544  80 552  78"
            fill="none" stroke-width="1.4" stroke-linecap="round"/>
          <path class="br" d="M 504  90 Q 510 100 514 110"
            fill="none" stroke-width="1.8" stroke-linecap="round"/>
        <path class="br" d="M 464 105 Q 472 122 478 138"
          fill="none" stroke-width="3.2" stroke-linecap="round"/>
          <path class="br" d="M 478 138 Q 488 148 495 158"
            fill="none" stroke-width="2" stroke-linecap="round"/>
          <path class="br" d="M 495 158 Q 504 165 510 172"
            fill="none" stroke-width="1.3" stroke-linecap="round"/>
          <path class="br" d="M 478 138 Q 484 152 488 165"
            fill="none" stroke-width="1.6" stroke-linecap="round"/>

      <!-- UPPER-MID branch -->
      <path class="br" d="M 362 215 Q 405 218 438 228 Q 470 238 496 252"
        fill="none" stroke-width="5" stroke-linecap="round"/>
        <path class="br" d="M 496 252 Q 518 248 534 244"
          fill="none" stroke-width="3" stroke-linecap="round"/>
          <path class="br" d="M 534 244 Q 548 240 558 237"
            fill="none" stroke-width="1.8" stroke-linecap="round"/>
          <path class="br" d="M 534 244 Q 542 254 546 264"
            fill="none" stroke-width="1.4" stroke-linecap="round"/>
        <path class="br" d="M 496 252 Q 510 268 520 282"
          fill="none" stroke-width="2.6" stroke-linecap="round"/>
          <path class="br" d="M 520 282 Q 532 290 542 295"
            fill="none" stroke-width="1.6" stroke-linecap="round"/>
          <path class="br" d="M 520 282 Q 526 298 530 312"
            fill="none" stroke-width="1.4" stroke-linecap="round"/>

      <!-- LOWER LOBE bronchus -->
      <path class="br" d="M 362 215 Q 378 258 392 312 Q 404 365 408 418"
        fill="none" stroke-width="6" stroke-linecap="round"/>
        <path class="br" d="M 392 312 Q 422 308 450 312"
          fill="none" stroke-width="3.2" stroke-linecap="round"/>
          <path class="br" d="M 450 312 Q 474 308 495 312"
            fill="none" stroke-width="2" stroke-linecap="round"/>
            <path class="br" d="M 495 312 Q 512 308 526 310"
              fill="none" stroke-width="1.3" stroke-linecap="round"/>
          <path class="br" d="M 450 312 Q 462 328 470 344"
            fill="none" stroke-width="1.8" stroke-linecap="round"/>
            <path class="br" d="M 470 344 Q 480 355 488 365"
              fill="none" stroke-width="1.2" stroke-linecap="round"/>
        <path class="br" d="M 404 365 Q 432 360 458 364"
          fill="none" stroke-width="2.8" stroke-linecap="round"/>
          <path class="br" d="M 458 364 Q 482 360 504 362"
            fill="none" stroke-width="1.7" stroke-linecap="round"/>
            <path class="br" d="M 504 362 Q 522 360 536 362"
              fill="none" stroke-width="1.1" stroke-linecap="round"/>
          <path class="br" d="M 458 364 Q 470 382 478 396"
            fill="none" stroke-width="1.5" stroke-linecap="round"/>
        <path class="br" d="M 408 418 Q 438 418 464 422"
          fill="none" stroke-width="2.5" stroke-linecap="round"/>
          <path class="br" d="M 464 422 Q 488 424 508 428"
            fill="none" stroke-width="1.5" stroke-linecap="round"/>
            <path class="br" d="M 508 428 Q 524 430 538 434"
              fill="none" stroke-width="1.0" stroke-linecap="round"/>
          <path class="br" d="M 464 422 Q 474 440 480 454"

        <path class="br" d="M 408 418 Q 412 440 415 458"

    <!-- ══════════════════ TRACHEA & CARINA ══════════════════ -->
    <g id="trachea">
      <!-- Trachea tube -->
      <rect x="279" y="8"  width="42" height="118" rx="21"
        fill="#e07888" stroke="#b05060" stroke-width="2"/>
      <!-- Inner trachea shading -->
      <rect x="284" y="12" width="14" height="110" rx="7"
        fill="white" opacity="0.16"/>
      <!-- Cartilage rings (C-shaped ridges) -->
      <rect x="281" y="20"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="32"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="44"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="56"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="68"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="80"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="92"  width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>
      <rect x="281" y="104" width="38" height="8" rx="4" fill="none" stroke="#c06070" stroke-width="2"   opacity="0.65"/>

      <!-- Carina – left bronchus (to right lung) -->
      <path d="M 285 126 Q 268 132 255 152"
        fill="none" stroke="#b05060" stroke-width="22" stroke-linecap="round"/>
      <path d="M 285 126 Q 268 132 255 152"
        fill="none" stroke="#e07888" stroke-width="15" stroke-linecap="round"/>
      <path d="M 285 126 Q 268 132 255 152"
        fill="none" stroke="white"   stroke-width="4"  stroke-linecap="round" opacity="0.18"/>

      <!-- Carina – right bronchus (to left lung) -->
      <path d="M 315 126 Q 332 130 345 152"
        fill="none" stroke="#b05060" stroke-width="22" stroke-linecap="round"/>
      <path d="M 315 126 Q 332 130 345 152"
        fill="none" stroke="#e07888" stroke-width="15" stroke-linecap="round"/>
      <path d="M 315 126 Q 332 130 345 152"
        fill="none" stroke="white"   stroke-width="4"  stroke-linecap="round" opacity="0.18"/>
    </g>

  </svg>
</div>

<div class="lw">
  <span class="lbl" id="li">Inhale</span>
  <span class="lbl" id="le">Exhale</span>
</div>

<div class="ctrls">
  <button id="btnP">Pause</button>
  <button id="btnR">Restart</button>
</div>
<div class="srow">
  <span>Slow</span>
  <input type="range" id="spd" min="0.3" max="3" step="0.1" value="1">
  <span>Fast</span>
</div>

<script>
  let paused = false;
  const all = document.querySelectorAll(
    '#rl,#ll,.lf,.lfL,.br,.glow,#li,#le'
  );

  document.getElementById('btnP').addEventListener('click', () => {
    paused = !paused;
    all.forEach(e => e.style.animationPlayState = paused ? 'paused' : 'running');
    document.getElementById('btnP').textContent = paused ? 'Play' : 'Pause';
  });

  document.getElementById('btnR').addEventListener('click', () => {
    all.forEach(e => {
      e.style.animation = 'none';
      e.offsetHeight;
      e.style.animation = '';
      e.style.animationPlayState = 'running';
    });
    paused = false;
    document.getElementById('btnP').textContent = 'Pause';
  });

  document.getElementById('spd').addEventListener('input', e => {
    const d = (5 / parseFloat(e.target.value)).toFixed(2) + 's';
    all.forEach(el => el.style.animationDuration = d);
  });
</script>
</body>
</html>
