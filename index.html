<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lottie Animation Demo</title>
  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1117;
    }

    .card {
      background: #161b22;
      padding: 40px 48px;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-width: 320px;
    }

    h1 { color: #e6edf3; font-size: 22px; font-weight: 600; }

    .subtitle { color: #8b949e; font-size: 14px; }

    #lottie-container {
      width: 240px;
      height: 240px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lottie Animation</h1>
    <p class="subtitle">Trim-path arc animation powered by lottie-web</p>
    <div id="lottie-container"></div>
    <span class="badge">Connected via lottie-web CDN</span>
  </div>

  <script>
    const animationData = {
      v: "5.9.0",
      fr: 60,
      ip: 0,
      op: 120,
      w: 240,
      h: 240,
      nm: "Arc Spinner",
      ddd: 0,
      assets: [],
      layers: [
        {
          ddd: 0, ind: 1, ty: 4, nm: "Track",
          sr: 1,
          ks: {
            o: { a: 0, k: 100 },
            r: { a: 0, k: 0 },
            p: { a: 0, k: [120, 120, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: { a: 0, k: [100, 100, 100] }
          },
          ao: 0,
          shapes: [
            {
              ty: "gr",
              nm: "Track Group",
              it: [
                {
                  ty: "el", nm: "Track Ellipse",
                  d: 1,
                  s: { a: 0, k: [180, 180] },
                  p: { a: 0, k: [0, 0] }
                },
                {
                  ty: "st", nm: "Track Stroke",
                  c: { a: 0, k: [0.15, 0.2, 0.28, 1] },
                  o: { a: 0, k: 100 },
                  w: { a: 0, k: 16 },
                  lc: 2, lj: 2
                },
                {
                  ty: "tr",
                  p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] },
                  s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 },
                  o: { a: 0, k: 100 }
                }
              ]
            }
          ],
          ip: 0, op: 120, st: 0, bm: 0
        },
        {
          ddd: 0, ind: 2, ty: 4, nm: "Arc",
          sr: 1,
          ks: {
            o: { a: 0, k: 100 },
            r: {
              a: 1,
              k: [
                { i: { x: [0.5], y: [1] }, o: { x: [0.5], y: [0] }, t: 0,   s: [-90] },
                { t: 120, s: [270] }
              ]
            },
            p: { a: 0, k: [120, 120, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: { a: 0, k: [100, 100, 100] }
          },
          ao: 0,
          shapes: [
            {
              ty: "gr",
              nm: "Arc Group",
              it: [
                {
                  ty: "el", nm: "Arc Ellipse",
                  d: 1,
                  s: { a: 0, k: [180, 180] },
                  p: { a: 0, k: [0, 0] }
                },
                {
                  ty: "st", nm: "Arc Stroke",
                  c: { a: 0, k: [0.25, 0.6, 0.95, 1] },
                  o: { a: 0, k: 100 },
                  w: { a: 0, k: 16 },
                  lc: 2, lj: 2
                },
                {
                  ty: "tm", nm: "Trim Paths",
                  s: { a: 0, k: 0 },
                  e: {
                    a: 1,
                    k: [
                      { i: { x: [0.42], y: [1] }, o: { x: [0.58], y: [0] }, t: 0,  s: [5]  },
                      { i: { x: [0.42], y: [1] }, o: { x: [0.58], y: [0] }, t: 60, s: [75] },
                      { t: 120, s: [5] }
                    ]
                  },
                  o: { a: 0, k: 0 },
                  m: 1
                },
                {
                  ty: "tr",
                  p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] },
                  s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 },
                  o: { a: 0, k: 100 }
                }
              ]
            }
          ],
          ip: 0, op: 120, st: 0, bm: 0
        },
        {
          ddd: 0, ind: 3, ty: 4, nm: "Glow",
          sr: 1,
          ks: {
            o: {
              a: 1,
              k: [
                { i: { x: [0.5], y: [1] }, o: { x: [0.5], y: [0] }, t: 0,  s: [30] },
                { i: { x: [0.5], y: [1] }, o: { x: [0.5], y: [0] }, t: 60, s: [80] },
                { t: 120, s: [30] }
              ]
            },
            r: { a: 0, k: 0 },
            p: { a: 0, k: [120, 120, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: {
              a: 1,
              k: [
                { i: { x: [0.5, 0.5], y: [1, 1] }, o: { x: [0.5, 0.5], y: [0, 0] }, t: 0,  s: [90, 90, 100] },
                { i: { x: [0.5, 0.5], y: [1, 1] }, o: { x: [0.5, 0.5], y: [0, 0] }, t: 60, s: [110, 110, 100] },
                { t: 120, s: [90, 90, 100] }
              ]
            }
          },
          ao: 0,
          shapes: [
            {
              ty: "gr",
              nm: "Glow Group",
              it: [
                {
                  ty: "el", nm: "Glow Ellipse",
                  d: 1,
                  s: { a: 0, k: [60, 60] },
                  p: { a: 0, k: [0, 0] }
                },
                {
                  ty: "fl", nm: "Glow Fill",
                  c: { a: 0, k: [0.25, 0.6, 0.95, 1] },
                  o: { a: 0, k: 100 },
                  r: 1
                },
                {
                  ty: "tr",
                  p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] },
                  s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 },
                  o: { a: 0, k: 100 }
                }
              ]
            }
          ],
          ip: 0, op: 120, st: 0, bm: 0
        }
      ]
    };

    lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      animationData: animationData
    });
  </script>
</body>
</html>
